name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests examples

      - name: Test
        run: uv run pytest

      - name: Examples (offline, fake LLM server)
        run: |
          for script in examples/0*.py; do
            echo "::group::$script"
            uv run python "$script"
            echo "::endgroup::"
          done

      - name: Build
        run: uv build
