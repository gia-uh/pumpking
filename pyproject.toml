[project]
name = "pumpking"
version = "1.0.0"
description = "Document chunking for RAG: rule-based and LLM-backed strategies composed into pipelines that keep chunk lineage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Yudivián Almeida Cruz", email = "yudiviant@gmail.com" }
]
keywords = ["chunking", "rag", "text-splitting", "llm", "nlp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5.0",
    "markdown>=3.5.0",
    "openai>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/gia-uh/pumpking"
Repository = "https://github.com/gia-uh/pumpking"
Issues = "https://github.com/gia-uh/pumpking/issues"
Changelog = "https://github.com/gia-uh/pumpking/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

# --- Ruff (Linter) ---
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# Long lines are mostly LLM prompts and Field descriptions sent to the model;
# wrapping them would change what the model reads.
ignore = ["E501"]

# --- Mypy (Types) ---
[tool.mypy]
strict = true